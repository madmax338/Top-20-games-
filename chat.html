```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.header {
    height: 65px;
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.header h2 {
    margin: 0;
    font-size: 21px;
}

.menu {
    position: relative;
}

.menu-button {
    background: transparent;
    color: white;
    border: none;
    font-size: 30px;
    cursor: pointer;
    padding: 5px;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    width: 210px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 10px;
    overflow: hidden;
    z-index: 100;
}

.dropdown button {
    display: block;
    width: 100%;
    padding: 15px;
    background: #1e293b;
    color: white;
    border: none;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
}

.dropdown button:hover {
    background: #334155;
}

.chat-container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.locked-box {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

#chatArea {
    display: none;
}

.chat-window {
    background: #020617;
    border-radius: 14px;
    padding: 16px;
    min-height: 350px;
    max-height: 500px;
    overflow-y: auto;
}

.chat-message {
    background: #334155;
    border-radius: 10px;
    padding: 11px 14px;
    margin: 9px 0;
    word-wrap: break-word;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#messageInput {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}

#sendButton {
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#passwordBox {
    display: none;
    background: #1e293b;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    margin-top: 20px;
}

#passwordInput {
    width: 220px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

#unlockButton {
    padding: 13px 18px;
    margin-left: 5px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;

    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
}

@media (max-width: 500px) {

    .input-area {
        flex-direction: column;
    }

    #sendButton {
        width: 100%;
    }

    #passwordInput {
        width: 100%;
        margin-bottom: 10px;
    }

    #unlockButton {
        width: 100%;
        margin-left: 0;
    }

}

</style>
</head>

<body>

<div class="header">

    <h2>💬 Chat</h2>

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu()">
            ⋮
        </button>

        <div
            class="dropdown"
            id="menuBox">

            <button onclick="letterSensitive()">
                1. Letter Sensitive
            </button>

            <button onclick="emojiSensitive()">
                2. Emoji Sensitive
            </button>

            <button onclick="wordSensitive()">
                3. Word Sensitive
            </button>

            <button onclick="openPage()">
                4. Open Page
            </button>

        </div>

    </div>

</div>


<div class="chat-container">

    <div
        class="locked-box"
        id="lockedBox">

        🔒 Chat Locked

    </div>


    <div id="passwordBox">

        <h3>🔐 Word Sensitive</h3>

        <p>Enter password</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password">

        <button
            id="unlockButton"
            onclick="unlockChat()">

            UNLOCK

        </button>

    </div>


    <div id="chatArea">

        <div
            class="chat-window"
            id="chatWindow">

            <div class="chat-message">
                Loading messages...
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message...">

            <button
                id="sendButton"
                onclick="sendMessage()">

                SEND

            </button>

        </div>

    </div>

</div>


<footer>
    💬 Chat
</footer>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCpbvdIcj6-97RhFZZHO188ZaE_DeMia7M",

    authDomain: "top-20-games.firebaseapp.com",

    projectId: "top-20-games",

    storageBucket: "top-20-games.firebasestorage.app",

    messagingSenderId: "635285760659",

    appId: "1:635285760659:web:88eeb84967029ef2017b66"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================
   UNIQUE DEVICE ID
========================================= */

/*
   Each browser gets its own ID.

   Phone 1 → one ID
   Phone 2 → different ID

   The ID remains after page refresh.
*/

let myDeviceId = localStorage.getItem("top20games_device_id");


if (!myDeviceId) {

    myDeviceId =
        "device_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10);

    localStorage.setItem(
        "top20games_device_id",
        myDeviceId
    );

}


/* =========================================
   MENU
========================================= */

window.toggleMenu = function () {

    const menu =
        document.getElementById("menuBox");

    if (menu.style.display === "block") {

        menu.style.display = "none";

    } else {

        menu.style.display = "block";

    }

};


/* =========================================
   LETTER SENSITIVE
========================================= */

window.letterSensitive = function () {

    window.location.href = "index.html";

};


/* =========================================
   EMOJI SENSITIVE
========================================= */

window.emojiSensitive = function () {

    window.location.href = "index.html";

};


/* =========================================
   WORD SENSITIVE
========================================= */

window.wordSensitive = function () {

    document.getElementById("menuBox").style.display = "none";

    document.getElementById("passwordBox").style.display = "block";

    document.getElementById("passwordInput").value = "";

    document.getElementById("passwordInput").focus();

};


/* =========================================
   UNLOCK CHAT
========================================= */

window.unlockChat = function () {

    const password =
        document.getElementById("passwordInput").value;

    if (password === "Varuu@1234") {

        document.getElementById("passwordBox").style.display = "none";

        document.getElementById("lockedBox").style.display = "none";

        document.getElementById("chatArea").style.display = "block";

        document.getElementById("messageInput").focus();

    } else {

        alert("❌ Incorrect password");

    }

};


/* =========================================
   SEND MESSAGE
========================================= */

window.sendMessage = async function () {

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if (message === "") {
        return;
    }


    try {

        await addDoc(
            collection(db, "messages"),
            {

                senderId: myDeviceId,

                message: message,

                createdAt: serverTimestamp()

            }
        );


        input.value = "";

        input.focus();


    } catch (error) {

        console.error(
            "Firebase send error:",
            error
        );

        alert(
            "❌ Message send failed."
        );

    }

};


/* =========================================
   REAL-TIME MESSAGES
========================================= */

const messagesQuery = query(

    collection(db, "messages"),

    orderBy(
        "createdAt",
        "asc"
    )

);


onSnapshot(

    messagesQuery,

    (snapshot) => {

        const chat =
            document.getElementById("chatWindow");


        chat.innerHTML = "";


        snapshot.forEach(

            (doc) => {

                const data =
                    doc.data();


                const newMessage =
                    document.createElement("div");


                newMessage.className =
                    "chat-message";


                /*
                   If this message was sent
                   from this device → You

                   Otherwise → Sender
                */

                let senderName;


                if (
                    data.senderId &&
                    data.senderId === myDeviceId
                ) {

                    senderName = "👤 You";

                } else {

                    senderName = "👤 Sender";

                }


                newMessage.textContent =
                    senderName +
                    ": " +
                    (data.message || "");


                chat.appendChild(
                    newMessage
                );

            }

        );


        chat.scrollTop =
            chat.scrollHeight;

    },


    (error) => {

        console.error(
            "Firestore read error:",
            error
        );

        const chat =
            document.getElementById("chatWindow");

        chat.innerHTML =
            '<div class="chat-message">❌ Unable to load messages.</div>';

    }

);


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                window.sendMessage();

            }

        }
    );


/* =========================================
   OPEN PAGE
========================================= */

window.openPage = function () {

    document.getElementById("menuBox").style.display = "none";

    window.location.href = "about:blank";

};

</script>

</body>
</html>
