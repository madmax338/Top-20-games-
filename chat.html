```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.header {
    height: 65px;
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.header h2 {
    margin: 0;
    font-size: 21px;
}

.menu {
    position: relative;
}

.menu-button {
    background: transparent;
    color: white;
    border: none;
    font-size: 30px;
    cursor: pointer;
    padding: 5px;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    width: 210px;

    border-radius: 10px;
    overflow: hidden;
    z-index: 100;
}

.dropdown button {
    display: block;
    width: 100%;
    padding: 15px;
    background: #1e293b;

    cursor: pointer;

.dropdown button:hover {
    background: #334155;
}

.chat-container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.locked-box {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

#chatArea {
    display: none;
}

.chat-window {
    background: #020617;
    border-radius: 14px;
    padding: 16px;
    min-height: 350px;
    max-height: 500px;
    overflow-y: auto;
}

.chat-message {
    background: #334155;
    border-radius: 10px;
    padding: 11px 14px;
    margin: 9px 0;

}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#messageInput {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}

#sendButton {
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#passwordBox {
    display: none;
    background: #1e293b;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    margin-top: 20px;
}

#passwordInput {
    width: 220px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;

#unlockButton {
    padding: 13px 18px;
    margin-left: 5px;

}

#usernameBox {
    display: none;

    inset: 0;

    align-items: center;
    justify-content: center;
    z-index: 999;
}

.username-card {
    width: 90%;
    max-width: 360px;
    background: #1e293b;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
}

#usernameInput {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    margin: 12px 0;
}

#usernameButton {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
}

@media (max-width: 500px) {

    .input-area {
        flex-direction: column;
    }

    #sendButton {
        width: 100%;
    }

    #passwordInput {
        width: 100%;
        margin-bottom: 10px;

</style>
</head>

<body>

<!-- USERNAME POPUP -->

<div id="usernameBox">

    <div class="username-card">

        <h2>👤 Welcome</h2>

        <p>Enter your username</p>

        <input
            type="text"
            id="usernameInput"
            placeholder="Username"
            maxlength="30">

        <button
            id="usernameButton"
            onclick="saveUsername()">

            CONTINUE

        </button>

    </div>

</div>


<!-- HEADER -->

<div class="header">

    <h2>💬 Chat</h2>

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu()">

            ⋮

        </button>

        <div
            class="dropdown"
            id="menuBox">

            <button onclick="letterSensitive()">
                1. Letter Sensitive
            </button>

            <button onclick="emojiSensitive()">
                2. Emoji Sensitive
            </button>

            <button onclick="wordSensitive()">
                3. Word Sensitive
            </button>

            <button onclick="changeUsername()">
                4. Change Username
            </button>

        </div>

    </div>

</div>


<!-- MAIN -->

<div class="chat-container">

    <!-- LOCKED -->

    <div
        class="locked-box"
        id="lockedBox">

        🔒 Chat Locked
        <br>
        <small>Use Word Sensitive to unlock</small>

    </div>


    <!-- PASSWORD -->

    <div id="passwordBox">

        <h3>🔐 Word Sensitive</h3>

        <p>Enter password</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password">

        <button
            id="unlockButton"
            onclick="unlockChat()">

            UNLOCK

        </button>

    </div>


    <!-- CHAT -->

    <div id="chatArea">

        <div
            class="chat-window"
            id="chatWindow">

            <div class="chat-message">
                Loading messages...
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message...">

            <button
                id="sendButton"
                onclick="sendMessage()">

                SEND

            </button>

        </div>

    </div>

</div>


<footer>
    💬 Chat
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig = {

    apiKey: "AIzaSyCpbvdIcj6-97RhFZZHO188ZaE_DeMia7M",

    authDomain: "top-20-games.firebaseapp.com",

    projectId: "top-20-games",

    storageBucket: "top-20-games.firebasestorage.app",

    messagingSenderId: "635285760659",

    appId: "1:635285760659:web:88eeb84967029ef2017b66"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* ==========================================
   USER DATA
========================================== */

let userId =
    localStorage.getItem(
        "top20_user_id"
    );


let username =
    localStorage.getItem(
        "top20_username"
    );


/* ==========================================
   CREATE USER ID
========================================== */

function createUserId() {

    return (
        "user_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );

}


/* ==========================================
   USERNAME POPUP
========================================== */

function showUsernameBox() {

    document.getElementById(
        "usernameBox"
    ).style.display = "flex";

}


/* ==========================================
   SAVE USERNAME
========================================== */

window.saveUsername = async function () {

    const input =
        document.getElementById(
            "usernameInput"
        );


    const newUsername =
        input.value.trim();


    if (newUsername === "") {

        alert(
            "Please enter a username."
        );

        return;

    }


    if (newUsername.length < 2) {

        alert(
            "Username must be at least 2 characters."
        );

        return;

    }


    /* Create NEW identity */

    userId =
        createUserId();


    username =
        newUsername;


    localStorage.setItem(
        "top20_user_id",
        userId
    );


    localStorage.setItem(
        "top20_username",
        username
    );


    /* Save user to Firestore */

    try {

        await addDoc(
            collection(
                db,
                "users"
            ),
            {

                userId: userId,

                username: username,

                createdAt:
                    serverTimestamp()

            }
        );

    } catch (error) {

        console.error(
            "User save error:",
            error
        );

    }


    /* Close username popup */

    document.getElementById(
        "usernameBox"
    ).style.display = "none";


    /*
       IMPORTANT:
       Chat stays LOCKED.
       Username does NOT unlock chat.
    */

};


/* ==========================================
   FIRST VISIT
========================================== */

if (!userId || !username) {

    showUsernameBox();

}


/* ==========================================
   CHANGE USERNAME
========================================== */

window.changeUsername = function () {

    document.getElementById(
        "menuBox"
    ).style.display = "none";


    document.getElementById(
        "usernameInput"
    ).value = "";


    showUsernameBox();

};


/* ==========================================
   MENU
========================================== */

window.toggleMenu = function () {

    const menu =
        document.getElementById(
            "menuBox"
        );


    if (
        menu.style.display === "block"
    ) {

        menu.style.display = "none";

    } else {

        menu.style.display = "block";

    }

};


/* ==========================================
   LETTER SENSITIVE
========================================== */

window.letterSensitive = function () {

    window.location.href =
        "index.html";

};


/* ==========================================
   EMOJI SENSITIVE
========================================== */

window.emojiSensitive = function () {

    window.location.href =
        "index.html";

};


/* ==========================================
   WORD SENSITIVE
========================================== */

window.wordSensitive = function () {

    document.getElementById(
        "menuBox"
    ).style.display = "none";


    document.getElementById(
        "passwordBox"
    ).style.display = "block";


    document.getElementById(
        "passwordInput"
    ).value = "";


    document.getElementById(
        "passwordInput"
    ).focus();

};


/* ==========================================
   UNLOCK
========================================== */

window.unlockChat = function () {

    const password =
        document.getElementById(
            "passwordInput"
        ).value;


    if (
        password === "Varuu@1234"
    ) {

        document.getElementById(
            "passwordBox"
        ).style.display = "none";


        document.getElementById(
            "lockedBox"
        ).style.display = "none";


        document.getElementById(
            "chatArea"
        ).style.display = "block";


        document.getElementById(
            "messageInput"
        ).focus();

    } else {

        alert(
            "❌ Incorrect password"
        );

    }

};


/* ==========================================
   SEND MESSAGE
========================================== */

window.sendMessage = async function () {

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (message === "") {

        return;

    }


    if (!userId || !username) {

        alert(
            "Please enter username first."
        );

        return;

    }


    try {

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                senderId: userId,

                senderName: username,

                message: message,

                createdAt:
                    serverTimestamp()

            }
        );


        input.value = "";

        input.focus();


    } catch (error) {

        console.error(
            "Send error:",
            error
        );


        alert(
            "❌ Message send failed."
        );

    }

};


/* ==========================================
   REAL-TIME CHAT
========================================== */

const messagesQuery =
    query(

        collection(
            db,
            "messages"
        ),

        orderBy(
            "createdAt",
            "asc"
        )

    );


onSnapshot(

    messagesQuery,

    (snapshot) => {

        const chat =
            document.getElementById(
                "chatWindow"
            );


        chat.innerHTML = "";


        snapshot.forEach(
            (doc) => {

                const data =
                    doc.data();


                const newMessage =
                    document.createElement(
                        "div"
                    );


                newMessage.className =
                    "chat-message";


                let senderName;


                if (
                    data.senderId &&
                    data.senderId === userId
                ) {

                    senderName =
                        "👤 You";

                } else {

                    senderName =
                        "👤 " +
                        (
                            data.senderName ||
                            "Sender"
                        );

                }


                newMessage.textContent =
                    senderName +
                    ": " +
                    (
                        data.message ||
                        ""
                    );


                chat.appendChild(
                    newMessage
                );

            }
        );


        chat.scrollTop =
            chat.scrollHeight;

    },


    (error) => {

        console.error(
            "Firestore read error:",
            error
        );

    }

);


/* ==========================================
   ENTER KEY
========================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                window.sendMessage();

            }

        }
    );

</script>

</body>

</html>
