<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.header {
    height: 65px;
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.header h2 {
    margin: 0;
    font-size: 21px;
}

.menu {
    position: relative;
}

.menu-button {
    background: transparent;
    color: white;
    border: none;
    font-size: 30px;
    cursor: pointer;
    padding: 5px;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    width: 210px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 10px;
    overflow: hidden;
    z-index: 100;
}

.dropdown button {
    display: block;
    width: 100%;
    padding: 15px;
    background: #1e293b;
    color: white;
    border: none;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
}

.dropdown button:hover {
    background: #334155;
}

.chat-container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.locked-box {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

#chatArea {
    display: none;
}

.chat-window {
    background: #020617;
    border-radius: 14px;
    padding: 16px;
    min-height: 350px;
    max-height: 500px;
    overflow-y: auto;
}

.chat-message {
    background: #334155;
    border-radius: 10px;
    padding: 11px 14px;
    margin: 9px 0;
    word-wrap: break-word;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#messageInput {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}

#sendButton {
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#passwordBox {
    display: none;
    background: #1e293b;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    margin-top: 20px;
}

#passwordInput {
    width: 220px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

#unlockButton {
    padding: 13px 18px;
    margin-left: 5px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
}

@media (max-width: 500px) {
    .input-area {
        flex-direction: column;
    }

    #sendButton {
        width: 100%;
    }

    #passwordInput {
        width: 100%;
        margin-bottom: 10px;
    }

    #unlockButton {
        width: 100%;
        margin-left: 0;
    }
}
</style>
</head>

<body>

<div class="header">

    <h2>💬 Chat</h2>

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu()">
            ⋮
        </button>

        <div
            class="dropdown"
            id="menuBox">

            <button onclick="letterSensitive()">
                1. Letter Sensitive
            </button>

            <button onclick="emojiSensitive()">
                2. Emoji Sensitive
            </button>

            <button onclick="wordSensitive()">
                3. Word Sensitive
            </button>

            <button onclick="openPage()">
                4. Open Page
            </button>

        </div>

    </div>

</div>


<div class="chat-container">

    <div
        class="locked-box"
        id="lockedBox">

        🔒 Chat Locked

    </div>


    <div id="passwordBox">

        <h3>🔐 Word Sensitive</h3>

        <p>Enter password</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password">

        <button
            id="unlockButton"
            onclick="unlockChat()">

            UNLOCK

        </button>

    </div>


    <div id="chatArea">

        <div
            class="chat-window"
            id="chatWindow">

            <div class="chat-message">
                👤 Friend: Hey!
            </div>

            <div class="chat-message">
                👤 Friend: How are you?
            </div>

            <div class="chat-message">
                👤 You: I'm good! 😊
            </div>

            <div class="chat-message">
                👤 Friend: Nice 👍
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message...">

            <button
                id="sendButton"
                onclick="sendMessage()">

                SEND

            </button>

        </div>

    </div>

</div>


<footer>
    💬 Chat
</footer>


<script>

function toggleMenu() {

    const menu =
        document.getElementById("menuBox");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}


/* 1. Letter Sensitive → Home */

function letterSensitive() {

    window.location.href = "index.html";

}


/* 2. Emoji Sensitive → Home */

function emojiSensitive() {

    window.location.href = "index.html";

}


/* 3. Word Sensitive → Password */

function wordSensitive() {

    document.getElementById("menuBox").style.display = "none";

    document.getElementById("passwordBox").style.display = "block";

    document.getElementById("passwordInput").value = "";

    document.getElementById("passwordInput").focus();

}


/* Word Sensitive Password */

function unlockChat() {

    const password =
        document.getElementById("passwordInput").value;

    if (password === "Varuu@1234") {

        document.getElementById("passwordBox").style.display = "none";

        document.getElementById("lockedBox").style.display = "none";

        document.getElementById("chatArea").style.display = "block";

        document.getElementById("messageInput").focus();

    } else {

        alert("❌ Incorrect password");

    }

}


/* Send message */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if (message === "") {
        return;
    }

    const chat =
        document.getElementById("chatWindow");

    const newMessage =
        document.createElement("div");

    newMessage.className = "chat-message";

    newMessage.textContent =
        "👤 You: " + message;

    chat.appendChild(newMessage);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;

}


/* Enter key sends message */

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });


/* 4. Open Page */

function openPage() {

    document.getElementById("menuBox").style.display = "none";

    window.location.href = "about:blank";

}

</script>

</body>
</html>
