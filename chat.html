<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}


/* ================= HEADER ================= */

.header {
    height: 65px;
    background: #1e293b;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;
}

.header h2 {
    margin: 0;
    font-size: 21px;
}


/* ================= MENU ================= */

.menu {
    position: relative;
}

.menu-button {
    background: transparent;
    color: white;
    border: none;

    font-size: 30px;

    cursor: pointer;

    padding: 5px;
}

.dropdown {
    display: none;

    position: absolute;

    right: 0;
    top: 45px;

    width: 230px;

    background: #1e293b;

    border: 1px solid #475569;

    border-radius: 10px;

    overflow: hidden;

    z-index: 100;
}

.dropdown button {
    display: block;

    width: 100%;

    padding: 15px;

    background: #1e293b;

    color: white;

    border: none;

    text-align: left;

    font-size: 15px;

    cursor: pointer;
}

.dropdown button:hover {
    background: #334155;
}


/* ================= CONTAINER ================= */

.chat-container {
    width: 94%;

    max-width: 700px;

    margin: 25px auto;
}


/* ================= LOCK ================= */

.locked-box {
    background: #1e293b;

    border-radius: 14px;

    padding: 20px;

    text-align: center;
}


/* ================= CHAT ================= */

#chatArea {
    display: none;
}

.chat-window {
    background: #020617;

    border-radius: 14px;

    padding: 16px;

    min-height: 350px;

    max-height: 500px;

    overflow-y: auto;
}

.chat-message {
    background: #334155;

    border-radius: 10px;

    padding: 11px 14px;

    margin: 9px 0;

    word-wrap: break-word;
}


/* ================= INPUT ================= */

.input-area {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

#messageInput {
    flex: 1;

    padding: 13px;

    border: none;

    border-radius: 9px;

    font-size: 16px;

    outline: none;
}

#sendButton {
    padding: 13px 20px;

    border: none;

    border-radius: 9px;

    background: #2563eb;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* ================= PASSWORD BOX ================= */

#passwordBox {
    display: none;

    background: #1e293b;

    border-radius: 14px;

    padding: 25px;

    text-align: center;

    margin-top: 20px;
}


/* PASSWORD WRAPPER */

.password-wrapper {
    position: relative;

    width: 100%;

    max-width: 320px;

    margin: 15px auto;
}


/* PASSWORD INPUT */

#passwordInput {
    width: 100%;

    height: 48px;

    padding: 12px 50px 12px 14px;

    border: none;

    border-radius: 9px;

    font-size: 16px;

    outline: none;

    background: white;

    color: black;
}


/* EYE BUTTON */

#eyeButton {
    position: absolute;

    right: 4px;

    top: 4px;

    width: 40px;

    height: 40px;

    padding: 0;

    border: none;

    background: transparent;

    color: black;

    font-size: 21px;

    cursor: pointer;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* UNLOCK */

#unlockButton {
    padding: 13px 22px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* ================= USERNAME POPUP ================= */

#usernameBox {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.85);

    align-items: center;

    justify-content: center;

    z-index: 999;
}

.username-card {
    width: 90%;

    max-width: 360px;

    background: #1e293b;

    border-radius: 15px;

    padding: 25px;

    text-align: center;
}

#usernameInput {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    outline: none;

    margin: 12px 0;
}

#usernameButton {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* ================= CURRENT USER ================= */

#currentUser {
    text-align: center;

    color: #94a3b8;

    margin-bottom: 12px;

    font-size: 14px;
}


/* ================= FOOTER ================= */

footer {
    text-align: center;

    padding: 30px;

    color: #94a3b8;
}


/* ================= MOBILE ================= */

@media (max-width: 500px) {

    .input-area {
        flex-direction: column;
    }

    #sendButton {
        width: 100%;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     USERNAME POPUP
========================================== -->

<div id="usernameBox">

    <div class="username-card">

        <h2>👤 Welcome</h2>

        <p>Enter your username</p>

        <input
            type="text"
            id="usernameInput"
            placeholder="Username"
            maxlength="30"
            autocomplete="off">

        <button
            id="usernameButton"
            onclick="selectUsername()">

            CONTINUE

        </button>

    </div>

</div>


<!-- ==========================================
     HEADER
========================================== -->

<div class="header">

    <h2>💬 Chat</h2>


    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu()">

            ⋮

        </button>


        <div
            class="dropdown"
            id="menuBox">


            <button onclick="letterSensitive()">

                1. Letter Sensitive

            </button>


            <button onclick="emojiSensitive()">

                2. Emoji Sensitive

            </button>


            <button onclick="wordSensitive()">

                3. Word Sensitive

            </button>


            <button onclick="changeUsername()">

                4. Change Username

            </button>


        </div>

    </div>

</div>


<!-- ==========================================
     MAIN
========================================== -->

<div class="chat-container">


    <!-- LOCKED -->

    <div
        class="locked-box"
        id="lockedBox">

        🔒 Chat Locked

        <br>

        <small>
            Use Word Sensitive to unlock
        </small>

    </div>


    <!-- ======================================
         PASSWORD
    ======================================= -->

    <div id="passwordBox">

        <h3>🔐 Word Sensitive</h3>

        <p>Enter password</p>


        <div class="password-wrapper">


            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="off">


            <button
                id="eyeButton"
                type="button"
                onclick="togglePassword()">

                👁️

            </button>


        </div>


        <button
            id="unlockButton"
            onclick="unlockChat()">

            UNLOCK

        </button>


    </div>


    <!-- ======================================
         CHAT
    ======================================= -->

    <div id="chatArea">


        <div id="currentUser"></div>


        <div
            class="chat-window"
            id="chatWindow">

            <div class="chat-message">

                Loading messages...

            </div>

        </div>


        <div class="input-area">


            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off">


            <button
                id="sendButton"
                onclick="sendMessage()">

                SEND

            </button>


        </div>


    </div>


</div>


<footer>

    💬 Chat

</footer>


<!-- ==========================================
     FIREBASE SCRIPT
========================================== -->

<script type="module">


/* ==========================================
   FIREBASE IMPORT
========================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyCpbvdIcj6-97RhFZZHO188ZaE_DeMia7M",

    authDomain:
    "top-20-games.firebaseapp.com",

    projectId:
    "top-20-games",

    storageBucket:
    "top-20-games.firebasestorage.app",

    messagingSenderId:
    "635285760659",

    appId:
    "1:635285760659:web:88eeb84967029ef2017b66"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* ==========================================
   VARIABLES
========================================== */

let userId = null;

let username = null;

let unsubscribeMessages = null;


/* ==========================================
   CREATE USER ID
========================================== */

function createUserId() {

    return (

        "user_" +

        Date.now() +

        "_" +

        Math.random()
            .toString(36)
            .substring(2, 10)

    );

}


/* ==========================================
   USERNAME POPUP
========================================== */

function showUsernameBox() {

    document.getElementById(
        "usernameBox"
    ).style.display = "flex";


    document.getElementById(
        "usernameInput"
    ).value = "";


    setTimeout(
        function () {

            document.getElementById(
                "usernameInput"
            ).focus();

        },
        100
    );

}


/* ==========================================
   SELECT USERNAME
========================================== */

window.selectUsername =
async function () {


    const input =
        document.getElementById(
            "usernameInput"
        );


    const enteredName =
        input.value.trim();


    if (
        enteredName === ""
    ) {

        alert(
            "Please enter a username."
        );

        return;

    }


    if (
        enteredName.length < 2
    ) {

        alert(
            "Username must be at least 2 characters."
        );

        return;

    }


    const normalizedName =
        enteredName.toLowerCase();


    try {


        /* FIND EXISTING USER */

        const userQuery =
            query(

                collection(
                    db,
                    "users"
                ),

                where(
                    "usernameLower",
                    "==",
                    normalizedName
                )

            );


        const userSnapshot =
            await getDocs(
                userQuery
            );


        if (
            !userSnapshot.empty
        ) {


            const existingUser =
                userSnapshot.docs[0].data();


            userId =
                existingUser.userId;


            username =
                existingUser.username;


        } else {


            /* CREATE NEW USER */

            userId =
                createUserId();


            username =
                enteredName;


            await addDoc(

                collection(
                    db,
                    "users"
                ),

                {

                    userId:
                        userId,

                    username:
                        username,

                    usernameLower:
                        normalizedName,

                    createdAt:
                        serverTimestamp()

                }

            );

        }


        /* CLOSE POPUP */

        document.getElementById(
            "usernameBox"
        ).style.display = "none";


        /* LOCK CHAT */

        document.getElementById(
            "lockedBox"
        ).style.display = "block";


        document.getElementById(
            "passwordBox"
        ).style.display = "none";


        document.getElementById(
            "chatArea"
        ).style.display = "none";


    }


    catch (error) {


        console.error(
            "Username error:",
            error
        );


        alert(
            "❌ Could not set username. Check Firebase Rules."
        );

    }

};


/* ==========================================
   MENU
========================================== */

window.toggleMenu =
function () {


    const menu =
        document.getElementById(
            "menuBox"
        );


    if (
        menu.style.display === "block"
    ) {

        menu.style.display = "none";

    }

    else {

        menu.style.display = "block";

    }

};


/* ==========================================
   LETTER
========================================== */

window.letterSensitive =
function () {

    window.location.href =
        "index.html";

};


/* ==========================================
   EMOJI
========================================== */

window.emojiSensitive =
function () {

    window.location.href =
        "index.html";

};


/* ==========================================
   WORD SENSITIVE
========================================== */

window.wordSensitive =
function () {


    document.getElementById(
        "menuBox"
    ).style.display = "none";


    if (!username) {

        showUsernameBox();

        return;

    }


    document.getElementById(
        "passwordBox"
    ).style.display = "block";


    document.getElementById(
        "passwordInput"
    ).value = "";


    document.getElementById(
        "passwordInput"
    ).type = "password";


    document.getElementById(
        "eyeButton"
    ).textContent = "👁️";


    document.getElementById(
        "passwordInput"
    ).focus();

};


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

window.togglePassword =
function () {


    const input =
        document.getElementById(
            "passwordInput"
        );


    const eye =
        document.getElementById(
            "eyeButton"
        );


    if (
        input.type === "password"
    ) {


        input.type = "text";


        eye.textContent =
            "🙈";


    }

    else {


        input.type =
            "password";


        eye.textContent =
            "👁️";

    }

};


/* ==========================================
   UNLOCK
========================================== */

window.unlockChat =
function () {


    const password =
        document.getElementById(
            "passwordInput"
        ).value;


    /* PASSWORD */

    if (
        password === "Varad@1234"
    ) {


        document.getElementById(
            "passwordBox"
        ).style.display = "none";


        document.getElementById(
            "lockedBox"
        ).style.display = "none";


        document.getElementById(
            "chatArea"
        ).style.display = "block";


        document.getElementById(
            "currentUser"
        ).textContent =
            "Logged in as: " +
            username;


        startChat();


        document.getElementById(
            "messageInput"
        ).focus();


    }

    else {


        alert(
            "❌ Incorrect password"
        );

    }

};


/* ==========================================
   START SHARED CHAT
========================================== */

function startChat() {


    if (
        unsubscribeMessages
    ) {

        unsubscribeMessages();

    }


    /*
      ALL USERS SEE THE SAME CHAT.
      Sender name comes from senderName.
    */

    const messagesQuery =
        query(

            collection(
                db,
                "messages"
            ),

            orderBy(
                "createdAt",
                "asc"
            )

        );


    unsubscribeMessages =
        onSnapshot(

            messagesQuery,


            function (snapshot) {


                const chat =
                    document.getElementById(
                        "chatWindow"
                    );


                chat.innerHTML = "";


                snapshot.forEach(
                    function (doc) {


                        const data =
                            doc.data();


                        const message =
                            document.createElement(
                                "div"
                            );


                        message.className =
                            "chat-message";


                        /*
                          If senderId matches
                          current user:
                          show You.

                          Otherwise show
                          their username.
                        */

                        if (
                            data.senderId ===
                            userId
                        ) {


                            message.textContent =
                                "👤 You: " +
                                (
                                    data.message ||
                                    ""
                                );


                        }

                        else {


                            message.textContent =
                                "👤 " +
                                (
                                    data.senderName ||
                                    "Sender"
                                ) +
                                ": " +
                                (
                                    data.message ||
                                    ""
                                );

                        }


                        chat.appendChild(
                            message
                        );

                    }
                );


                chat.scrollTop =
                    chat.scrollHeight;

            },


            function (error) {


                console.error(
                    "Read error:",
                    error
                );


                document.getElementById(
                    "chatWindow"
                ).innerHTML =
                    '<div class="chat-message">❌ Could not load messages.</div>';

            }

        );

}


/* ==========================================
   SEND MESSAGE
========================================== */

window.sendMessage =
async function () {


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (
        message === ""
    ) {

        return;

    }


    if (
        !userId ||
        !username
    ) {

        alert(
            "Please select username first."
        );

        return;

    }


    try {


        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                senderId:
                    userId,

                senderName:
                    username,

                message:
                    message,

                createdAt:
                    serverTimestamp()

            }

        );


        input.value = "";


        input.focus();


    }

    catch (error) {


        console.error(
            "Send error:",
            error
        );


        alert(
            "❌ Message send failed."
        );

    }

};


/* ==========================================
   CHANGE USERNAME
========================================== */

window.changeUsername =
function () {


    document.getElementById(
        "menuBox"
    ).style.display = "none";


    if (
        unsubscribeMessages
    ) {

        unsubscribeMessages();

        unsubscribeMessages =
            null;

    }


    userId = null;

    username = null;


    document.getElementById(
        "chatArea"
    ).style.display = "none";


    document.getElementById(
        "passwordBox"
    ).style.display = "none";


    document.getElementById(
        "lockedBox"
    ).style.display = "block";


    showUsernameBox();

};


/* ==========================================
   ENTER KEY - USERNAME
========================================== */

document
    .getElementById(
        "usernameInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                window.selectUsername();

            }

        }
    );


/* ==========================================
   ENTER KEY - PASSWORD
========================================== */

document
    .getElementById(
        "passwordInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                window.unlockChat();

            }

        }
    );


/* ==========================================
   ENTER KEY - MESSAGE
========================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                window.sendMessage();

            }

        }
    );


/* ==========================================
   ALWAYS ASK USERNAME ON PAGE LOAD
========================================== */

showUsernameBox();


</script>

</body>

</html>
